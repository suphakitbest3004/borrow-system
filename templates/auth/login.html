{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ{% endblock %}

{% block content %}
<div class="auth-container w-100">
    <div style="margin-bottom: 16px;">
        <a href="{{ url_for('index') }}" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 500;">
            ← กลับหน้าแรก
        </a>
    </div>
    <div class="card w-100">
        <div class="card-body auth-card-body">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="width: 52px; height: 52px; background: var(--primary); color: white; border-radius: var(--radius-lg); display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 0.75rem;">
                    📦
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">เข้าสู่ระบบ</h1>
                <p style="font-size: 15px; color: var(--text-muted); margin-bottom: 0;">ระบบยืม-คืนวัสดุและครุภัณฑ์ วิทยาลัยการอาชีพหนองหาน</p>
            </div>

            <!-- Standard Login Form -->
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group mb-3">
                    <label class="form-label">อีเมลผู้ใช้งาน</label>
                    <input type="email" name="email" class="form-control" placeholder="เช่น student@nonghan.ac.th" required autofocus autocomplete="email">
                </div>

                <div class="form-group mb-3">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label class="form-label" style="margin-bottom: 0;">รหัสผ่าน</label>
                    </div>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary w-100" style="padding: 12px; font-size: 16px; font-weight: 600; margin-top: 8px;">
                    เข้าสู่ระบบ
                </button>
            </form>

            <div style="margin: 1.75rem 0; display: flex; align-items: center; text-align: center; color: var(--text-subtle); font-size: 0.8rem;">
                <div style="flex: 1; border-bottom: 1px solid var(--border);"></div>
                <span style="padding: 0 0.75rem; font-weight: 500;">หรือเข้าสู่ระบบทดสอบตามบทบาท</span>
                <div style="flex: 1; border-bottom: 1px solid var(--border);"></div>
            </div>

            <!-- Quick Demo Login Buttons -->
            <form action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 0.6rem;">
                <button type="submit" name="quick_role" value="admin" class="btn btn-secondary" style="justify-content: flex-start; padding: 0.6rem 0.85rem;">
                    <span style="font-size: 1.1rem;">🛡️</span>
                    <div style="text-align: left; line-height: 1.2;">
                        <div style="font-weight: 600; font-size: 0.85rem;">ผู้ดูแลระบบ (Admin)</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">จัดการระบบทั้งหมด / อนุมัติ / เพิ่มลบข้อมูล</div>
                    </div>
                </button>

                <button type="submit" name="quick_role" value="staff" class="btn btn-secondary" style="justify-content: flex-start; padding: 0.6rem 0.85rem;">
                    <span style="font-size: 1.1rem;">📋</span>
                    <div style="text-align: left; line-height: 1.2;">
                        <div style="font-weight: 600; font-size: 0.85rem;">เจ้าหน้าที่พัสดุ (Staff)</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">ตรวจสอบและกดอนุมัติคำขอยืม / บันทึกรับคืน / ออกใบเสร็จ</div>
                    </div>
                </button>

                <button type="submit" name="quick_role" value="student" class="btn btn-secondary" style="justify-content: flex-start; padding: 0.6rem 0.85rem;">
                    <span style="font-size: 1.1rem;">🎓</span>
                    <div style="text-align: left; line-height: 1.2;">
                        <div style="font-weight: 600; font-size: 0.85rem;">นักเรียน/นักศึกษา (Student)</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">ดูข้อมูลส่วนตัว / ยื่นคำขอยืม / ตรวจสอบกำหนดคืน</div>
                    </div>
                </button>

                <button type="submit" name="quick_role" value="teacher" class="btn btn-secondary" style="justify-content: flex-start; padding: 0.6rem 0.85rem;">
                    <span style="font-size: 1.1rem;">👨‍🏫</span>
                    <div style="text-align: left; line-height: 1.2;">
                        <div style="font-weight: 600; font-size: 0.85rem;">อาจารย์/ครูผู้สอน (Teacher)</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">ยืมอุปกรณ์สำหรับการเรียนการสอน</div>
                    </div>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
                ยังไม่มีบัญชีผู้ใช้? <a href="{{ url_for('register') }}" style="color: var(--accent-blue); font-weight: 600;">สมัครสมาชิกใหม่</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
